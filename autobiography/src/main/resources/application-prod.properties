spring.application.name=autobiography

# Server Port
server.port=8081

# ??? ??
spring.http.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true

# Actuator (??? ?? ??????? ??? ?? ??)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Database Setting (?? ?? ??)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis Setting
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=2000ms

# AWS S3
aws.s3.bucket=ssafytrip
aws.s3.base-url=https://ssafytrip.s3.ap-northeast-2.amazonaws.com/
aws.s3.region=ap-northeast-2
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.allowed-extensions=jpg,jpeg,png,mp3,wav,m4a
aws.s3.max-file-size=10485760

# JWT & Security
jwt.secret=${JWT_SECRET}

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=https://baehobin.duckdns.org/login/oauth2/code/google
app.oauth2.authorizedRedirectUri=https://baehobin.duckdns.org/auth/callback

# Mail Setting
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# AI & LiveKit
openai.api.url=${AI_API_URL}
openai.api-key=ollama-local-server
ai.model.editor=gemma3:12b
livekit.serverUrl=${LIVEKIT_URL}
livekit.apiKey=${LIVEKIT_API_KEY}
livekit.apiSecret=${LIVEKIT_API_SECRET}

# STT & TTS
deepgram.api-key=${DEEPGRAM_API_KEY}
stt.provider=deepgram
gcp.credentials.location=tts_key.json

# ?? ? ?? ??
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.connection-timeout=120000
spring.mvc.async.request-timeout=120000