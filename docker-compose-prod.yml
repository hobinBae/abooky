version: '3.8'

services:
  # 1. 백엔드 서비스 (Spring Boot)
  backend:
    build: ./autobiography
    container_name: be-abooky
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env # 아까 만든 환경 변수 파일 로드
    ports:
      - "8081:8081"
    networks:
      - my-proxy-net

  # 2. 프론트엔드 서비스 (Vue.js + Nginx)
  frontend:
    build: ./mybook
    container_name: fe-abooky
    restart: always
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro # 인증서 파일 연결 (읽기 전용)
      - ./mybook/nginx.conf:/etc/nginx/nginx.conf:ro # mybook 폴더 내의 nginx.conf 사용
    ports:
      - "80:80" # HTTP 및 인증용
      - "443:443" # HTTPS 실서비스용
      - "82:443"
    networks:
      - my-proxy-net

networks:
  # 기존 인프라(MySQL, Redis)가 속해 있는 외부 네트워크 연결
  my-proxy-net:
    external: true
